name: Build report and compare with original

on:
  push:
    paths:
      - "reference/original.pdf"
      - "data/**"
      - "templates/**"
      - "sars_pdf/**"
      - "scripts/**"
      - "reports/**"
      - "fonts/**"
  workflow_dispatch:

permissions:
  contents: write

# Serialise runs per branch so back-to-back merges don't race each other's
# bot pushes of the same generated files.
concurrency:
  group: compare-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # The documented SUCCESS EXAMPLE: the top-level Lakezone report. Unchanged.
  compare:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: System fonts and Pango
        run: sudo apt-get update && sudo apt-get install -y fonts-liberation libpango-1.0-0 libpangoft2-1.0-0
      - run: pip install -r requirements.txt
      - name: Render report
        run: python -m sars_pdf.render data/lakezone_f2_mock_aug2026.json --pdf output/report.pdf --html output/report.html
      - name: Compare with original
        run: python scripts/compare.py
      - name: Commit output and comparison
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output
          # Both jobs push to the same branch: only push when there is a commit, and
          # rebase onto whatever the other job pushed first (they touch disjoint paths).
          if ! git diff --cached --quiet; then
            git commit -m "Update generated report and comparison [bot]"
            # Outputs are generated: on a conflict keep the freshly built files.
            git pull --rebase -X theirs origin "$GITHUB_REF_NAME"
            git push
          fi

  # The secondary council + region reports. Each report is self-contained; the
  # repo fonts/ dir carries the real fonts, with fonts-liberation as a fallback
  # install so WeasyPrint always has the metric-compatible faces available.
  compare-secondary:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: System fonts and Pango
        run: sudo apt-get update && sudo apt-get install -y fonts-liberation libpango-1.0-0 libpangoft2-1.0-0
      - name: Install repo fonts
        run: |
          if [ -d fonts ]; then
            mkdir -p ~/.local/share/fonts
            cp fonts/*.ttf ~/.local/share/fonts/ 2>/dev/null || true
            fc-cache -f ~/.local/share/fonts || true
          fi
      - run: pip install -r requirements.txt
      - name: Render and compare all secondary + primary reports
        run: python scripts/build_all.py
      - name: Commit report outputs and comparisons
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # build_all.py regenerates both reports/secondary and reports/primary.
          git add reports
          if ! git diff --cached --quiet; then
            git commit -m "Update secondary reports and comparisons [bot]"
            # Outputs are generated: on a conflict keep the freshly built files.
            git pull --rebase -X theirs origin "$GITHUB_REF_NAME"
            git push
          fi
